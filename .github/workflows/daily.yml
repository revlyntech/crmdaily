name: CRM Daily - Auto Publish Article

on:
  schedule:
    - cron: '30 2 * * *'   # 8:00 AM IST every day
    - cron: '30 12 * * *'  # 6:00 PM IST every day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-article:
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --no-cache-dir -r automation/requirements.txt

      - name: Run automation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WP_APP_PASSWORD:   ${{ secrets.WP_APP_PASSWORD }}
          NEWS_API_KEY:      ${{ secrets.NEWS_API_KEY }}
          BEEHIIV_API_KEY:   ${{ secrets.BEEHIIV_API_KEY }}
          BEEHIIV_PUB_ID:    ${{ secrets.BEEHIIV_PUB_ID }}
          RESEND_API_KEY:    ${{ secrets.RESEND_API_KEY }}
          PEXELS_API_KEY:    ${{ secrets.PEXELS_API_KEY }}
        run: python automation/main.py

      - name: Commit logs
        run: |
          git config user.name "CRM Daily Bot"
          git config user.email "bot@crmdaily.co"
          git add -f automation/published_titles.json automation/category_log.json automation/published_urls.json automation/daily_digest.json automation/used_topics.json automation/used_images.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No log changes to commit"
          else
            git commit -m "chore: update logs [skip ci]"
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push origin main && break
              echo "Push attempt $attempt failed, retrying..."
              sleep 5
            done
          fi

      - name: Done
        run: echo "✅ Done at $(date)"